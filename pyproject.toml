[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlt"]

[project]
name = "dlt"
version = "0.0.1"
dependencies = [
    "dataclasses-json",
    "scikit-learn",
    "jax[cpu]<0.10;platform_system=='Darwin'",
    "jax[cuda12]<0.10;platform_system=='Linux'",
    "transformers>=4.57,<5",
    "datasets",
    "evaluate",
    "flax",
    "nltk",
    "matplotlib",
    "tensorflow",
    "rouge_score",
    "py7zr",
    "tf-keras",
    "seaborn",
    "jupyter",
    "chex",
    "optax",
    "tensorboard",
]
requires-python = ">=3.11,<3.14"
authors = [
  {name = "Can Yaras", email = "cjyaras@gmail.com"},
]
description = "Deep LoRA."
readme = "README.md"
license = {file = "LICENSE"}
keywords = []